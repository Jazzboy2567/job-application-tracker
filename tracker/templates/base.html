<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Job Applications{% endblock %} · Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9cff'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='%230e1117' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <nav class="wrap nav">
      <a class="brand" href="/"><span class="brand-mark">✓</span>Job Tracker</a>
      {% set here = request.url.path %}
      <a href="/" {% if here == '/' %}aria-current="page"{% endif %}>Applications</a>
      <a href="/stats" {% if here == '/stats' %}aria-current="page"{% endif %}>Stats</a>
      <a href="/import" {% if here == '/import' %}aria-current="page"{% endif %}>Import</a>
      <a href="/export.csv">Export CSV</a>
    </nav>
  </header>
  <main class="wrap">
    {% if msg %}<p class="notice ok" role="status">{{ msg }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
